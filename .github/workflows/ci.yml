name: ci

on:
  push:
  pull_request:

jobs:
  rag-api:
    runs-on: ubuntu-latest
    # Throwaway PostgreSQL + pgvector for the vector-store and request-store tests (AI#33); never a real database.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FIRE3D_AI_TEST_PG_DSN: postgresql://postgres:test@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: rag-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rag-api/requirements-test.txt
      - run: pip install -r requirements-test.txt
      # FIRE3D_AI_TEST_PG_DSN trỏ vào service postgres ở trên, nên test pgvector chạy thật thay vì bị bỏ qua.
      - run: python -m pytest -q -rs --junitxml=test-results.xml --cov=app --cov-branch --cov-report=xml:coverage.xml --cov-report=json:coverage.json
      - run: python -m evals.run_eval --provider fake --out evals/reports/ci
      - name: Inventory AI modules
        if: always()
        run: python ../tools/test_inventory.py
      - name: Upload RAG coverage and test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-rag-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rag-api/coverage.xml
            rag-api/coverage.json
            rag-api/test-results.xml
            rag-api/evals/reports/ci/
            .codex/local/test-module-inventory.md
            .codex/local/test-module-inventory.json
          if-no-files-found: ignore

  ifc-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ifc-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ifc-worker/requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q -rs --junitxml=test-results.xml --cov=worker --cov-branch --cov-report=xml:coverage.xml --cov-report=json:coverage.json
      - name: Upload IFC coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-ifc-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ifc-worker/coverage.xml
            ifc-worker/coverage.json
            ifc-worker/test-results.xml
          if-no-files-found: ignore
